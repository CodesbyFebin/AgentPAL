name: 🐛 Bug report
description: Report something that is broken or incorrect
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run '...'
        2. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Enter the commit SHA, GitHub tag, or hosted demo.
      placeholder: Hosted demo
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Remove credentials, payment identifiers, and personal information before sharing logs.
      render: shell
